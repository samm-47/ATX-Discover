spring.application.name=austin-local-discovery

# Free, in-memory H2 database - no external DB server or credentials needed
spring.datasource.url=jdbc:h2:mem:austinlocal;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# Optional: enables the H2 web console at /h2-console for local debugging
spring.h2.console.enabled=true

server.port=8080
